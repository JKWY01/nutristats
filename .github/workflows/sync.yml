name: FDC data sync

# SR Legacy 是 USDA 标准参考库的最终版(2021-10-28 定格),数据本体不会再变——
# 月频同步是数据完整性金丝雀(源文件损坏/URL 失效会报警),日常靠每日线上体检。
on:
  schedule:
    - cron: '20 6 2 * *' # 每月 2 日:数据源检查
    - cron: '40 9 * * *' # 每天:线上体检
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: site-ops
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '20 6 2 * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync FDC data
        run: node scripts/sync-fdc.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "JKWY01"
          git config user.email "71512658+JKWY01@users.noreply.github.com"
          git add data/fdc-sr.json
          if git diff --cached --quiet; then
            echo "no data change, nothing to push"
            exit 0
          fi
          git commit -m "sync: FDC SR Legacy data [skip ci]"
          git push

      - name: IndexNow ping (optional)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        if: ${{ env.SITE_URL != '' }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then echo "no indexnow key, skip"; exit 0; fi
          for path in "" "/categories" "/rankings/protein" "/food/bananas-raw"; do
            curl -s -o /dev/null -w "indexnow $path -> %{http_code}\n" \
              "https://api.indexnow.org/indexnow?url=${SITE_URL}${path}&key=${INDEXNOW_KEY}"
          done

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --search "🚨 in:title" --state open --json number --jq length)
          if [ "${OPEN:-0}" = "0" ]; then
            gh issue create \
              --title "🚨 FDC sync failed — $(date -u '+%F %T') UTC" \
              --body "自动告警:FDC 数据同步失败,站点放养中需要人工查看。
          运行记录:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          修复后请关闭本 issue。" || echo "issue create failed (non-fatal)"
          else
            echo "alert issue already open, skip duplicate"
          fi

  healthcheck:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 9 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Health check live site
        run: node scripts/healthcheck.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --search "🚨 in:title" --state open --json number --jq length)
          if [ "${OPEN:-0}" = "0" ]; then
            gh issue create \
              --title "🚨 healthcheck failed — $(date -u '+%F %T') UTC" \
              --body "自动告警:线上体检未通过,站点放养中需要人工查看。
          运行记录:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          修复后请关闭本 issue。" || echo "issue create failed (non-fatal)"
          else
            echo "alert issue already open, skip duplicate"
          fi
